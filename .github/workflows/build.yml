name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Unzip project
        run: |
          unzip -o gdz_6b_android_apk_project.zip -d extracted
          cp -r extracted/gdz_android/* .
          cp -r extracted/gdz_android/.[!.]* . 2>/dev/null || true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: GDZ-6B-APK
          path: app/build/outputs/apk/debug/*.apk
