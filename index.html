<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPOOX AI — локальный AI в браузере</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#0a0a0f; --bg2:#111118; --surface:#16161f; --surface2:#1c1c28;
  --border:#26262f; --text:#eceef4; --text-dim:#9a9aad; --accent:#7c5cff;
  --accent2:#00e0c6; --danger:#ff5c7a; --ok:#3ddc84;
}
:root[data-theme="light"]{
  --bg:#f5f5f9; --bg2:#ffffff; --surface:#ffffff; --surface2:#f0f0f6;
  --border:#e3e3ec; --text:#16161f; --text-dim:#6c6c80; --accent:#6a4bff; --accent2:#00b39e;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  overflow:hidden; font-size:var(--fs,16px);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.app{display:flex; height:100%; width:100%;}

/* Sidebar */
.sidebar{width:270px; flex-shrink:0; background:var(--bg2); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:14px; gap:10px; transition:transform .25s ease; z-index:50;}
.brand{display:flex; align-items:center; gap:10px; padding:8px 6px 14px;}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 20px rgba(124,92,255,.5);}
.brand-name{font-weight:700; letter-spacing:.5px; font-size:17px;}
.badge-local{font-size:10.5px; color:var(--ok); border:1px solid rgba(61,220,132,.35); background:rgba(61,220,132,.08); padding:1px 7px; border-radius:20px; margin-left:auto;}
.btn{display:flex; align-items:center; gap:8px; width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface); color:var(--text); cursor:pointer; font-size:14px; font-weight:500; transition:background .15s, border-color .15s;}
.btn:hover{background:var(--surface2); border-color:var(--accent);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#6a4bff); border:none; color:#fff; justify-content:center;}
.btn:disabled{opacity:.4; cursor:default;}
.history{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-top:6px;}
.hist-item{padding:10px 12px; border-radius:10px; font-size:13.5px; color:var(--text-dim); cursor:pointer;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; justify-content:space-between; align-items:center; gap:6px;}
.hist-item:hover, .hist-item.active{background:var(--surface2); color:var(--text);}
.hist-del{opacity:0; font-size:12px; padding:2px 6px; border-radius:6px;}
.hist-item:hover .hist-del{opacity:.6;}
.hist-del:hover{opacity:1 !important; color:var(--danger);}
.sidebar-foot{border-top:1px solid var(--border); padding-top:10px; display:flex; flex-direction:column; gap:8px;}
.model-pill{font-size:11.5px; color:var(--text-dim); padding:0 4px;}

/* Main */
.main{flex:1; display:flex; flex-direction:column; min-width:0; position:relative;}
.topbar{display:none; align-items:center; gap:10px; padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--border); background:var(--bg2);}
.icon-btn{width:38px;height:38px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:18px;}

/* Boot / loading screen */
.boot{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center; gap:14px;}
.boot-title{font-size:34px; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.boot-status{color:var(--text-dim); font-size:15px; max-width:420px;}
.boot-note{color:var(--text-dim); font-size:13px; max-width:420px; line-height:1.5; opacity:.85;}
.progress-wrap{width:100%; max-width:360px; height:8px; background:var(--surface2); border-radius:20px; overflow:hidden; border:1px solid var(--border);}
.progress-bar{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .2s ease;}
.progress-pct{font-size:13px; color:var(--text-dim);}
.model-select-wrap{display:flex; flex-direction:column; gap:8px; max-width:360px; width:100%;}
.model-opt{border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:12px 14px; text-align:left; cursor:pointer;}
.model-opt:hover{border-color:var(--accent);}
.model-opt .mo-name{font-weight:600; font-size:14px;}
.model-opt .mo-size{color:var(--text-dim); font-size:12.5px;}
.error-box{border:1px solid rgba(255,92,122,.4); background:rgba(255,92,122,.08); color:var(--danger); border-radius:12px; padding:14px 16px; max-width:420px; font-size:14px; text-align:left; line-height:1.5;}

/* Chat */
.hero{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; gap:10px;}
.hero-title{font-size:36px; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero-sub{color:var(--text-dim); font-size:16px; margin-bottom:18px;}
.chat-scroll{flex:1; overflow-y:auto; padding:20px 0;}
.chat-inner{max-width:760px; margin:0 auto; padding:0 16px; display:flex; flex-direction:column; gap:18px;}
.msg{display:flex; gap:12px; max-width:100%;}
.msg.user{flex-direction:row-reverse;}
.avatar{width:30px;height:30px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff;}
.msg.ai .avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));}
.msg.user .avatar{background:var(--surface2); color:var(--text);}
.bubble{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:12px 15px; font-size:15px; line-height:1.55; max-width:75%;}
.msg.user .bubble{background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(0,224,198,.1)); border-color:rgba(124,92,255,.35);}
.bubble p{margin:0 0 8px;} .bubble p:last-child{margin-bottom:0;}
.bubble pre{background:#0d0d14; border:1px solid var(--border); border-radius:10px; padding:12px; overflow-x:auto; margin:8px 0; font-size:13px;}
:root[data-theme="light"] .bubble pre{background:#f0f0f6;}
.bubble code{font-family:"SF Mono",Consolas,monospace;}
.bubble :not(pre) > code{background:var(--surface2); padding:1px 5px; border-radius:5px; font-size:.9em;}
.bubble ul,.bubble ol{margin:6px 0 6px 20px;}
.msg-actions{display:flex; gap:10px; margin-top:6px;}
.msg-actions button{background:none; border:none; color:var(--text-dim); font-size:12px; cursor:pointer; padding:3px 6px; border-radius:6px;}
.msg-actions button:hover{background:var(--surface2); color:var(--text);}
.typing{display:flex; gap:4px; padding:4px 0;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--accent); animation:blink 1.2s infinite ease-in-out;}
.typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8);} 40%{opacity:1;transform:scale(1);}}

.composer-wrap{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));}
.composer{max-width:760px; margin:0 auto; display:flex; align-items:flex-end; gap:10px; background:var(--surface);
  border:1px solid var(--border); border-radius:20px; padding:8px 8px 8px 18px; box-shadow:0 8px 30px rgba(0,0,0,.25);}
:root[data-theme="light"] .composer{box-shadow:0 8px 24px rgba(0,0,0,.08);}
.composer textarea{flex:1; background:none; border:none; outline:none; color:var(--text); font-size:15px; resize:none;
  max-height:160px; line-height:1.5; padding:9px 0; font-family:inherit;}
.composer textarea::placeholder{color:var(--text-dim);}
.send-btn{width:42px;height:42px; border-radius:14px; border:none; flex-shrink:0; background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:opacity .15s, transform .1s;}
.send-btn:disabled{opacity:.4; cursor:default;}
.send-btn:active:not(:disabled){transform:scale(.92);}
.stop-btn{width:42px;height:42px; border-radius:14px; border:1px solid var(--border); flex-shrink:0; background:var(--surface2);
  color:var(--danger); font-size:16px; cursor:pointer; display:none; align-items:center; justify-content:center;}
.hero .composer{width:100%; max-width:600px;}
.gen-hint{max-width:760px; margin:6px auto 0; text-align:center; font-size:12px; color:var(--text-dim);}

/* Modal / overlay */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:100; padding:16px;}
.overlay.open{display:flex;}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:22px; width:100%; max-width:400px; max-height:85vh; overflow-y:auto;}
.modal h3{margin-bottom:16px; font-size:17px;}
.setting-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); font-size:14px; gap:12px;}
.setting-row:last-child{border-bottom:none;}
.seg{display:flex; background:var(--surface2); border-radius:10px; padding:3px; gap:2px;}
.seg button{border:none; background:none; color:var(--text-dim); padding:6px 12px; border-radius:8px; font-size:13px; cursor:pointer;}
.seg button.active{background:var(--accent); color:#fff;}
.modal select{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 8px; font-size:13px; max-width:180px;}
.modal .btn{margin-top:10px;}
.modal .btn-danger{color:var(--danger); border-color:rgba(255,92,122,.3);}
.sys-info{font-size:13px; color:var(--text-dim); line-height:1.7;}
.sys-info b{color:var(--text);}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;}
.dot.ok{background:var(--ok);} .dot.bad{background:var(--danger);}

.sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40;}
@media (max-width:760px){
  .sidebar{position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,.4);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop.show{display:block;}
  .topbar{display:flex;}
  .hero-title,.boot-title{font-size:28px;}
  .bubble{max-width:86%;}
  .chat-inner{padding:0 10px;}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar-backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark"></div><div class="brand-name">SPOOX AI</div></div>
    <button class="btn btn-primary" id="newChatBtn" disabled>+ Новый чат</button>
    <div class="history" id="historyList"></div>
    <div class="sidebar-foot">
      <div class="model-pill" id="modelPill">Модель: —</div>
      <button class="btn" id="settingsBtn">⚙ Настройки</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn" id="menuBtn">☰</button>
      <div class="brand-name">SPOOX AI</div>
    </div>

    <!-- Boot screen -->
    <div class="boot" id="bootScreen">
      <div class="boot-title">SPOOX AI</div>
      <div id="bootBody"></div>
    </div>

    <div class="hero" id="hero" style="display:none;">
      <div class="hero-title">SPOOX AI</div>
      <div class="hero-sub">Чем я могу помочь?</div>
      <div class="composer" id="heroComposer">
        <textarea id="heroInput" placeholder="Напишите сообщение..." rows="1"></textarea>
        <button class="send-btn" id="heroSend">➤</button>
      </div>
    </div>

    <div class="chat-scroll" id="chatScroll" style="display:none;">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="composer-wrap" id="composerWrap" style="display:none;">
      <div class="composer">
        <textarea id="chatInput" placeholder="Напишите сообщение..." rows="1"></textarea>
        <button class="stop-btn" id="stopBtn" title="Остановить генерацию">■</button>
        <button class="send-btn" id="chatSend">➤</button>
      </div>
      <div class="gen-hint" id="genHint"></div>
    </div>
  </main>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h3>Настройки</h3>
    <div class="setting-row">
      <span>Модель</span>
      <select id="modelSwitchSel"></select>
    </div>
    <div class="setting-row">
      <span>Тема</span>
      <div class="seg" id="themeSeg"><button data-v="dark">Тёмная</button><button data-v="light">Светлая</button></div>
    </div>
    <div class="setting-row">
      <span>Размер текста</span>
      <div class="seg" id="sizeSeg"><button data-v="14px">A</button><button data-v="16px">A</button><button data-v="18px">A</button></div>
    </div>
    <div class="setting-row" style="flex-direction:column; align-items:flex-start; gap:8px;">
      <span>Информация о системе</span>
      <div class="sys-info" id="sysInfo">—</div>
    </div>
    <button class="btn btn-danger" id="clearHistoryBtn">Очистить историю чатов</button>
    <button class="btn btn-danger" id="deleteModelBtn">Удалить локальную модель (кэш)</button>
    <button class="btn" id="closeSettingsBtn">Закрыть</button>
  </div>
</div>

<script type="module">
import * as webllm from "https://esm.run/@mlc-ai/web-llm";

marked.setOptions({breaks:true});
const el = id => document.getElementById(id);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- local storage ---------- */
const store = {
  get chats(){ try{return JSON.parse(localStorage.getItem('spoox_chats')||'[]');}catch(e){return [];} },
  set chats(v){ try{localStorage.setItem('spoox_chats', JSON.stringify(v));}catch(e){} },
  get theme(){ return localStorage.getItem('spoox_theme') || 'dark'; },
  set theme(v){ try{localStorage.setItem('spoox_theme', v);}catch(e){} },
  get size(){ return localStorage.getItem('spoox_size') || '16px'; },
  set size(v){ try{localStorage.setItem('spoox_size', v);}catch(e){} },
  get modelId(){ return localStorage.getItem('spoox_model') || ''; },
  set modelId(v){ try{localStorage.setItem('spoox_model', v);}catch(e){} }
};
function applyTheme(){ document.documentElement.setAttribute('data-theme', store.theme); }
function applySize(){ document.documentElement.style.setProperty('--fs', store.size); }
applyTheme(); applySize();

let chats = store.chats;
let currentId = null;
let engine = null;
let generating = false;
let abortRequested = false;
let currentAssistantBubble = null;

const sidebar = el('sidebar'), backdrop = el('backdrop');
const hero = el('hero'), chatScroll = el('chatScroll'), chatInner = el('chatInner'), composerWrap = el('composerWrap');

/* ---------- curated small-model candidates (matched against the library's own list, never hardcoded blind) ---------- */
const CANDIDATES = [
  {pattern: /^SmolLM2-360M-Instruct-q4f16_1/i, label: "SPOOX 0.1", size: "≈ 240 МБ — самая лёгкая модель"},
  {pattern: /^Qwen2\.5-0\.5B-Instruct-q4f16_1/i, label: "SPOOX 0.2", size: "≈ 380 МБ — лёгкая модель"},
];
function getSpooxName(modelId){
  if(/SmolLM2-360M-Instruct/i.test(modelId)) return 'SPOOX 0.1';
  if(/Qwen2\.5-0\.5B-Instruct/i.test(modelId)) return 'SPOOX 0.2';
  return 'SPOOX';
}
function getSpooxSystemPrompt(modelId){
  const name = getSpooxName(modelId);
  return `Тебя зовут ${name}. Ты — ИИ-помощник SPOOX. Если пользователь спрашивает твоё имя или модель, называй себя именно ${name}. Не представляйся Gemma, Qwen, SmolLM или другим названием исходной модели. Отвечай на русском, если пользователь пишет по-русски.`;
}

function findModels(){
  const list = webllm.prebuiltAppConfig.model_list.map(m=>m.model_id);
  const found = [];
  CANDIDATES.forEach(c=>{
    const id = list.find(id=>c.pattern.test(id));
    if(id) found.push({id, label:c.label, size:c.size});
  });
  return found;
}

/* ---------- boot / model loading ---------- */
async function boot(){
  if(!navigator.gpu){
    el('bootBody').innerHTML = `
      <div class="error-box">
        В этом браузере нет WebGPU, поэтому запустить локальную модель невозможно —
        SPOOX AI не может подменить это фейковой имитацией AI.<br><br>
        На Android откройте страницу в свежем <b>Chrome</b> (обычно WebGPU уже включён с версии ~121+).
        Если не работает — проверьте <code>chrome://flags/#enable-unsafe-webgpu</code>.
        Полноценный WASM-фоллбэк для LLM такого класса в браузере практически непригоден по скорости,
        поэтому мы его не подставляем вместо настоящей модели.
      </div>`;
    return;
  }
  const models = findModels();
  if(models.length===0){
    el('bootBody').innerHTML = `<div class="error-box">Не удалось получить список моделей WebLLM (возможно, нет подключения к сети для первой загрузки библиотеки). Проверьте интернет-соединение и обновите страницу.</div>`;
    return;
  }
  let chosen = models.find(m=>m.id===store.modelId);
  if(!chosen){
    el('bootBody').innerHTML = `
      <div class="boot-status">Выберите версию SPOOX:</div>
      <div class="model-select-wrap" id="modelPicker"></div>
      <div class="boot-note">Модель загружается на устройство один раз. После загрузки AI может работать без API-ключа — все ответы генерируются прямо в браузере, ничего не отправляется на сервер.</div>`;
    const wrap = el('modelPicker');
    models.forEach(m=>{
      const b = document.createElement('button');
      b.className = 'model-opt';
      b.innerHTML = `<div class="mo-name">${esc(m.label)}</div><div class="mo-size">${esc(m.size)}</div>`;
      b.onclick = ()=>{ store.modelId = m.id; loadModel(m.id); };
      wrap.appendChild(b);
    });
    return;
  }
  loadModel(chosen.id);
}

async function loadModel(modelId){
  el('bootBody').innerHTML = `
    <div class="boot-status" id="loadStatus">Подготовка локальной модели...</div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-pct" id="progressPct">0%</div>
    <div class="boot-note">Модель загружается на устройство один раз. После загрузки AI может работать без API-ключа.</div>`;
  try{
    engine = await webllm.CreateMLCEngine(modelId, {
      initProgressCallback: (report)=>{
        const pct = Math.round((report.progress||0)*100);
        el('progressBar').style.width = pct+'%';
        el('progressPct').textContent = pct+'%';
        el('loadStatus').textContent = report.text || 'Загрузка...';
      }
    });
    const models = findModels();
    const info = models.find(m=>m.id===modelId);
    el('modelPill').textContent = info ? info.label : getSpooxName(modelId);
    populateModelSwitcher(modelId);
    updateSysInfo();
    el('newChatBtn').disabled = false;
    el('bootScreen').style.display = 'none';
    showHero();
    renderHistory();
  }catch(err){
    el('bootBody').innerHTML = `<div class="error-box">Не удалось загрузить модель: ${esc(err.message||String(err))}.<br><br>Проверьте соединение с интернетом (нужно для первой загрузки весов) и попробуйте снова, либо выберите модель поменьше.</div>
      <button class="btn" style="margin-top:14px;max-width:200px;" id="retryBtn">Выбрать модель заново</button>`;
    el('retryBtn').onclick = ()=>{ store.modelId=''; boot(); };
  }
}

function populateModelSwitcher(activeId){
  const sel = el('modelSwitchSel');
  sel.innerHTML = '';
  findModels().forEach(m=>{
    const o = document.createElement('option');
    o.value = m.id; o.textContent = m.label;
    if(m.id===activeId) o.selected = true;
    sel.appendChild(o);
  });
}
el('modelSwitchSel').addEventListener('change', async (e)=>{
  const newId = e.target.value;
  el('settingsOverlay').classList.remove('open');
  el('bootScreen').style.display = 'flex';
  hero.style.display='none'; chatScroll.style.display='none'; composerWrap.style.display='none';
  store.modelId = newId;
  await loadModel(newId);
});

async function updateSysInfo(){
  let gpuInfo = 'недоступен';
  try{
    if(navigator.gpu){
      const adapter = await navigator.gpu.requestAdapter();
      gpuInfo = adapter ? 'доступен' : 'не удалось получить адаптер';
    }
  }catch(e){}
  el('sysInfo').innerHTML = `
    <div><span class="dot ${navigator.gpu?'ok':'bad'}"></span><b>Локальный AI</b> — ответы генерируются на устройстве</div>
    <div><span class="dot ok"></span><b>API не используется</b> — запросы к OpenAI/Anthropic не отправляются</div>
    <div>WebGPU: <b>${gpuInfo}</b></div>
    <div>Модель: <b>${store.modelId || '—'}</b></div>
  `;
}

/* ---------- chat state / history ---------- */
function renderHistory(){
  const list = el('historyList'); list.innerHTML = '';
  chats.slice().reverse().forEach(c=>{
    const item = document.createElement('div');
    item.className = 'hist-item' + (c.id===currentId ? ' active':'');
    item.innerHTML = `<span>${esc(c.title||'Новый чат')}</span><span class="hist-del">✕</span>`;
    item.querySelector('span:first-child').onclick = ()=>{ openChat(c.id); closeSidebarMobile(); };
    item.querySelector('.hist-del').onclick = (e)=>{ e.stopPropagation(); deleteChat(c.id); };
    list.appendChild(item);
  });
}
function deleteChat(id){
  chats = chats.filter(c=>c.id!==id); store.chats = chats;
  if(currentId===id){ currentId=null; showHero(); }
  renderHistory();
}
function showHero(){ hero.style.display='flex'; chatScroll.style.display='none'; composerWrap.style.display='none'; }
function showChatView(){ hero.style.display='none'; chatScroll.style.display='block'; composerWrap.style.display='block'; }
function getChat(id){ return chats.find(c=>c.id===id); }
function openChat(id){
  currentId = id; const c = getChat(id); if(!c){ showHero(); return; }
  showChatView(); chatInner.innerHTML='';
  c.messages.forEach(m=>appendMessage(m.role, m.content));
  renderHistory(); scrollDown();
}
function newChat(){ currentId = null; showHero(); el('heroInput').value=''; renderHistory(); el('heroInput').focus(); }
function scrollDown(){ chatScroll.scrollTop = chatScroll.scrollHeight; }

function appendMessage(role, content){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role==='user'?'user':'ai');
  const bubbleHtml = role==='user' ? esc(content).replace(/\n/g,'<br>') : marked.parse(content||'');
  wrap.innerHTML = `<div class="avatar">${role==='user'?'Вы':'S'}</div>
    <div><div class="bubble">${bubbleHtml}</div>
    ${role!=='user' ? '<div class="msg-actions"><button class="copy-btn">Копировать</button><button class="regen-btn">Повторить</button></div>':''}
    </div>`;
  if(role!=='user'){
    wrap.querySelector('.copy-btn').onclick = ()=>{
      navigator.clipboard.writeText(content).catch(()=>{});
      const b = wrap.querySelector('.copy-btn'); b.textContent='Скопировано'; setTimeout(()=>b.textContent='Копировать',1500);
    };
    wrap.querySelector('.regen-btn').onclick = ()=> regenerate();
  }
  chatInner.appendChild(wrap);
  return wrap;
}
function appendTyping(){
  const wrap = document.createElement('div');
  wrap.className = 'msg ai'; wrap.id = 'typingIndicator';
  wrap.innerHTML = `<div class="avatar">S</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatInner.appendChild(wrap); scrollDown(); return wrap;
}

function setGenUI(on){
  el('heroSend').disabled = on; el('chatSend').disabled = on;
  el('stopBtn').style.display = on ? 'flex' : 'none';
  el('genHint').textContent = on ? 'SPOOX AI печатает…' : '';
}
function autoGrow(ta){ ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight,160)+'px'; }

async function send(text){
  text = (text||'').trim();
  if(!text || generating || !engine) return;
  if(currentId===null){
    currentId = 'c_'+Date.now();
    chats.push({id:currentId, title:text.slice(0,40), messages:[]});
    store.chats = chats; showChatView(); chatInner.innerHTML=''; renderHistory();
  }
  const c = getChat(currentId);
  c.messages.push({role:'user', content:text});
  appendMessage('user', text); scrollDown(); store.chats = chats;
  el('heroInput').value=''; el('chatInput').value=''; autoGrow(el('chatInput'));
  await runGeneration(c);
}

async function regenerate(){
  if(generating || currentId===null) return;
  const c = getChat(currentId);
  while(c.messages.length && c.messages[c.messages.length-1].role!=='user') c.messages.pop();
  if(!c.messages.length) return;
  store.chats = chats;
  chatInner.innerHTML=''; c.messages.forEach(m=>appendMessage(m.role, m.content));
  await runGeneration(c);
}

async function runGeneration(c){
  generating = true; abortRequested = false; setGenUI(true);
  const typingEl = appendTyping();
  try{
    const history = [
      {role:'system', content:getSpooxSystemPrompt(store.modelId)},
      ...c.messages.slice(-16).map(m=>({role:m.role, content:m.content}))
    ];
    const chunks = await engine.chat.completions.create({ messages: history, stream: true, temperature: 0.7 });
    let full = '';
    let bubbleEl = null;
    for await (const chunk of chunks){
      if(abortRequested) break;
      const delta = chunk.choices?.[0]?.delta?.content || '';
      if(delta){
        full += delta;
        if(!bubbleEl){ typingEl.remove(); const w = appendMessage('ai', ''); bubbleEl = w.querySelector('.bubble'); }
        bubbleEl.innerHTML = marked.parse(full);
        scrollDown();
      }
    }
    if(abortRequested){ try{ await engine.interruptGenerate(); }catch(e){} }
    if(!bubbleEl){ typingEl.remove(); appendMessage('ai', full || '(пустой ответ)'); }
    c.messages.push({role:'assistant', content: full});
    store.chats = chats;
  }catch(err){
    typingEl.remove();
    appendMessage('ai', 'Ошибка генерации: ' + (err.message||String(err)));
  }
  generating = false; setGenUI(false); scrollDown();
}

el('stopBtn').onclick = ()=>{ abortRequested = true; };

['heroInput','chatInput'].forEach(id=>{
  const ta = el(id);
  ta.addEventListener('input', ()=>autoGrow(ta));
  ta.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(ta.value); } });
});
el('heroSend').onclick = ()=>send(el('heroInput').value);
el('chatSend').onclick = ()=>send(el('chatInput').value);
el('newChatBtn').onclick = newChat;

function openSidebarMobile(){ sidebar.classList.add('open'); backdrop.classList.add('show'); }
function closeSidebarMobile(){ sidebar.classList.remove('open'); backdrop.classList.remove('show'); }
el('menuBtn').onclick = openSidebarMobile;
backdrop.onclick = closeSidebarMobile;

el('settingsBtn').onclick = ()=>{ el('settingsOverlay').classList.add('open'); syncSettingsUI(); updateSysInfo(); };
el('closeSettingsBtn').onclick = ()=> el('settingsOverlay').classList.remove('open');
el('settingsOverlay').addEventListener('click', (e)=>{ if(e.target===el('settingsOverlay')) el('settingsOverlay').classList.remove('open'); });
function syncSettingsUI(){
  document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('active', b.dataset.v===store.theme));
  document.querySelectorAll('#sizeSeg button').forEach(b=>b.classList.toggle('active', b.dataset.v===store.size));
}
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>{ store.theme=b.dataset.v; applyTheme(); syncSettingsUI(); });
document.querySelectorAll('#sizeSeg button').forEach(b=>b.onclick=()=>{ store.size=b.dataset.v; applySize(); syncSettingsUI(); });
el('clearHistoryBtn').onclick = ()=>{
  chats = []; store.chats = chats; currentId=null; showHero(); renderHistory();
  el('settingsOverlay').classList.remove('open');
};
el('deleteModelBtn').onclick = async ()=>{
  if(!confirm('Удалить загруженную модель из кэша браузера? Понадобится скачать её заново при следующем запуске.')) return;
  try{
    if(engine){ try{ await engine.unload(); }catch(e){} engine = null; }
    const names = await caches.keys();
    await Promise.all(names.filter(n=>/webllm|mlc/i.test(n)).map(n=>caches.delete(n)));
    store.modelId = '';
    location.reload();
  }catch(e){ alert('Не удалось полностью очистить кэш: ' + e.message); }
};

boot();
</script>
</body>
</html>
